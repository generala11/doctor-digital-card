
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102a43">
<title>Magdy Ahmed | Digital Business Card</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#102a43,#243b53);
  color: #243b53;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 22px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.language { text-align: left; margin-bottom: 15px; }

button {
  border: 1px solid #d5e0e8;
  background: #f3f7fa;
  color: #102a43;
  padding: 9px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}

.avatar {
  width: 95px;
  height: 95px;
  margin: 5px auto 18px;
  border-radius: 50%;
  background: #102a43;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: bold;
  border: 5px solid #e5edf3;
}

h1 { margin: 8px 0; font-size: 27px; color: #102a43; }
.job { color: #b18a45; font-weight: bold; font-size: 17px; margin: 8px 0; }
.pharmacy { font-size: 17px; margin: 12px 0 22px; color: #526777; }

.divider { height: 1px; background: #e5edf3; margin: 20px 0; }

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.action {
  display: block;
  text-decoration: none;
  padding: 14px 8px;
  border-radius: 12px;
  background: #102a43;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.whatsapp { background: #168b55; }
.email { background: #526777; }
.footer { color: #8495a3; font-size: 12px; margin-top: 25px; }
.status { font-size: 12px; color: #8495a3; margin-top: 12px; }
</style>
</head>

<body>
<main class="card">

  <div class="language">
    <button onclick="toggleLanguage()" id="langButton">English</button>
  </div>

  <div class="avatar">MA</div>

  <h1 id="name">مجدي أحمد</h1>
  <div class="job" id="job">صيدلي</div>
  <div class="pharmacy" id="pharmacy">صيدلية تداوينا</div>

  <div class="divider"></div>

  <div class="actions">
    <a class="action" id="call" href="tel:+966544517989">اتصال هاتفي</a>
    <a class="action whatsapp" id="whatsapp"
       href="https://wa.me/966544517989" target="_blank">واتساب</a>
    <a class="action email" id="email"
       href="mailto:phd.magdy@gmail.com">البريد الإلكتروني</a>
    <a class="action" id="location"
       href="https://maps.app.goo.gl/PVUyQBiJd7FfxfZx6?g_st=ac"
       target="_blank">موقع الصيدلية</a>
    <a class="action" id="saveContact" href="javascript:void(0)">
   حفظ جهة الاتصال
</a>
    <a class="action" id="review"
       href="#" target="_blank" hidden>تقييم Google</a>
  </div>

  <div class="status" id="status">جاري تحميل البيانات...</div>
  <div class="footer" id="footer">بطاقة اتصال رقمية عبر NFC</div>

</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getFirestore, doc, onSnapshot
} from
  "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAANrF8HVRQEr73AAd6UhLNSBF1CBxtnlM",
  authDomain: "doctordigitalcard-137f6.firebaseapp.com",
  projectId: "doctordigitalcard-137f6",
  storageBucket: "doctordigitalcard-137f6.firebasestorage.app",
  messagingSenderId: "406857874394",
  appId: "1:406857874394:web:14bba379016e9101fd9ee3",
  measurementId: "G-1XTXMCHR8G"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let isArabic = true;
let cardData = {};

function showData(data) {
  cardData = data;

  updateLanguage();

  document.getElementById("call").href =
    "tel:" + (data.phone || "");

  const number = (data.phone || "").replace(/\D/g, "");

  document.getElementById("whatsapp").href =
    "https://wa.me/" + number;

  document.getElementById("email").href =
    "mailto:" + (data.email || "");

  document.getElementById("location").href =
    data.mapUrl || "#";

  const review = document.getElementById("review");

  if (data.reviewUrl) {
    review.href = data.reviewUrl;
    review.hidden = false;
  } else {
    review.hidden = true;
  }

  document.getElementById("status").textContent =
    isArabic ? "البيانات محدثة" : "Information updated";
}
function escapeVCard(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/\r?\n/g, "\\n")
    .replace(/,/g, "\\,")
    .replace(/;/g, "\\;");
}

document.getElementById("saveContact").addEventListener("click", function(event) {
  event.preventDefault();

  try {
    const d = cardData;

    if (!d || (!d.nameAr && !d.nameEn)) {
      alert("بيانات البطاقة لم يتم تحميلها بعد");
      return;
    }

    const name = isArabic
      ? (d.nameAr || d.nameEn)
      : (d.nameEn || d.nameAr);

    const job = isArabic
      ? (d.jobAr || d.jobEn)
      : (d.jobEn || d.jobAr);

    const pharmacy = isArabic
      ? (d.pharmacyAr || d.pharmacyEn)
      : (d.pharmacyEn || d.pharmacyAr);

    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "FN:" + escapeVCard(name),
      "N:" + escapeVCard(name) + ";;;;",
      "ORG:" + escapeVCard(pharmacy),
      "TITLE:" + escapeVCard(job),
      "TEL;TYPE=CELL:" + escapeVCard(d.phone),
      "EMAIL;TYPE=INTERNET:" + escapeVCard(d.email),
      "URL:" + escapeVCard(d.mapUrl),
      "END:VCARD"
    ].join("\r\n");

    const blob = new Blob(
      [vcard],
      { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "Magdy-Ahmed.vcf";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 5000);

  } catch (error) {
    console.error("Contact download error:", error);
    alert("حدث خطأ أثناء إنشاء بطاقة الاتصال");
  }
});
function updateLanguage() {
  const d = cardData;

  document.documentElement.lang = isArabic ? "ar" : "en";
  document.documentElement.dir = isArabic ? "rtl" : "ltr";

  document.getElementById("name").textContent =
    (isArabic ? d.nameAr : d.nameEn) || "";

  document.getElementById("job").textContent =
    (isArabic ? d.jobAr : d.jobEn) || "";

  document.getElementById("pharmacy").textContent =
    (isArabic ? d.pharmacyAr : d.pharmacyEn) || "";

  document.getElementById("call").textContent =
    isArabic ? "اتصال هاتفي" : "Call";

  document.getElementById("whatsapp").textContent =
    isArabic ? "واتساب" : "WhatsApp";

  document.getElementById("email").textContent =
    isArabic ? "البريد الإلكتروني" : "Email";

  document.getElementById("location").textContent =
    isArabic ? "موقع الصيدلية" : "Pharmacy Location";
  
document.getElementById("saveContact").textContent =
    isArabic ? "حفظ جهة الاتصال" : "Save Contact";
  
  document.getElementById("review").textContent =
    isArabic ? "تقييم Google" : "Google Review";

  document.getElementById("footer").textContent =
    isArabic
      ? "بطاقة اتصال رقمية عبر NFC"
      : "Digital Business Card via NFC";

  document.getElementById("langButton").textContent =
    isArabic ? "English" : "العربية";
}

window.toggleLanguage = function() {
  isArabic = !isArabic;
  updateLanguage();
};

onSnapshot(doc(db, "cards", "main"), (snapshot) => {
  if (snapshot.exists()) {
    showData(snapshot.data());
  } else {
    document.getElementById("status").textContent =
      "Card data not found";
  }
}, (error) => {
  console.error(error);
  document.getElementById("status").textContent =
    "تعذر تحميل البيانات";
});
</script>

</body>
</html>
